name: Security regression tests

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "supabase/migrations/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/security-tests.yml"
  push:
    branches:
      - main

jobs:
  authorization-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run authorization regression tests
        run: node --test test/**/*.test.mjs

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test duplicate-index cleanup on disposable PostgreSQL 17
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f test/sql/duplicate-index-cleanup.integration.sql
